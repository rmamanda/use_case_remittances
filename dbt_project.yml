name: use_case_remittances
version: "1.0.0"
config-version: 2
profile: use_case_remittances
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages

data_tests:
  +store_failures: true

vars:
  raw_dir: "data/raw"
  payment_status_successful: "SUCCESSFUL"
  disbursement_outcome_success: "SUCCESS"
  recurring_min_remittances: 3
  recurring_min_months: 2
  pareto_volume_share: 0.5

models:
  use_case_remittances:
    # Descriptions land on the tables and columns in the database, not only in dbt docs.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
      # The facts are read, not just passed through, so their shape is locked too.
      +contract:
        enforced: true
    marts:
      +schema: marts
      +materialized: table
      # Marts are the published surface, so their shape is locked. Reverting a money
      # column to double, or dropping one a dashboard reads, fails the build here.
      +contract:
        enforced: true
