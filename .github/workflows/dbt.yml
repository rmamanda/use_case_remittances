name: dbt

on:
  push:
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Profile
        run: cp profiles.example.yml profiles.yml

      - name: Install packages
        run: dbt deps --profiles-dir .

      - name: Parse project
        run: dbt parse --profiles-dir .

      - name: Load raw and build (when CSVs present)
        run: |
          if [ -f data/raw/payments.csv ] && [ -f data/raw/receipts.csv ] && [ -f data/raw/disbursements.csv ]; then
            python scripts/load_raw.py
            dbt build --profiles-dir .
          else
            echo "Skipping load and dbt build: place assignment CSVs under data/raw/"
          fi
